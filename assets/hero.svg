<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Aryan Son Surkar - Building things, brick by brick">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e0e6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b61ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="trail-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" fill="url(#bg-grad)" rx="8" />

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#00d4ff" stroke-width="0.5">
    <line x1="0" y1="50" x2="900" y2="50" />
    <line x1="0" y1="100" x2="900" y2="100" />
    <line x1="0" y1="150" x2="900" y2="150" />
    <line x1="0" y1="200" x2="900" y2="200" />
    <line x1="0" y1="250" x2="900" y2="250" />
    <line x1="150" y1="0" x2="150" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="450" y1="0" x2="450" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="750" y1="0" x2="750" y2="300" />
  </g>

  <!-- Scattered stars -->
  <g fill="#ffffff" opacity="0.15">
    <circle cx="80" cy="45" r="1" />
    <circle cx="200" cy="30" r="0.8" />
    <circle cx="350" cy="60" r="1.2" />
    <circle cx="520" cy="35" r="0.7" />
    <circle cx="680" cy="55" r="1" />
    <circle cx="820" cy="40" r="0.9" />
    <circle cx="120" cy="260" r="0.8" />
    <circle cx="400" cy="270" r="1.1" />
    <circle cx="600" cy="255" r="0.6" />
    <circle cx="780" cy="265" r="1" />
    <circle cx="50" cy="150" r="0.7" />
    <circle cx="850" cy="130" r="0.9" />
    <circle cx="250" cy="180" r="0.5" />
    <circle cx="700" cy="190" r="0.8" />
  </g>

  <!-- Flight path trail (curved, subtle) -->
  <path d="M 0,200 Q 150,160 250,170 T 450,140 T 650,120 T 900,100"
        stroke="url(#trail-grad)" stroke-width="1.5" fill="none" opacity="0.3"
        stroke-dasharray="4,6" />

  <!-- Navigation dots along path -->
  <g fill="#00d4ff" opacity="0.2">
    <circle cx="150" cy="168" r="2" />
    <circle cx="300" cy="155" r="1.5" />
    <circle cx="450" cy="140" r="2" />
    <circle cx="600" cy="128" r="1.5" />
    <circle cx="750" cy="115" r="2" />
  </g>

  <!-- Airplane icon (flying right along the path) -->
  <g transform="translate(770, 108) rotate(-8)" filter="url(#glow)">
    <path d="M -12,0 L -4,-2 L 8,-6 L 12,-2 L 12,2 L 8,6 L -4,2 L -12,0 Z
             M -2,-2 L -2,-8 L 0,-10 L 2,-8 L 2,-2
             M 4,-6 L 6,-12 L 8,-12 L 6,-6
             M 4,6 L 6,12 L 8,12 L 6,6"
          fill="#00d4ff" opacity="0.9" />
  </g>

  <!-- Name -->
  <text x="450" y="120" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="42" font-weight="700" fill="url(#text-grad)" letter-spacing="3">
    ARYAN SON SURKAR
  </text>

  <!-- Accent line -->
  <rect x="350" y="138" width="200" height="2" rx="1" fill="url(#accent-grad)" opacity="0.6" />

  <!-- Tagline -->
  <text x="450" y="170" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="16" fill="#8892b0" font-weight="400" letter-spacing="1">
    Building things, brick by brick.
  </text>

  <!-- Focus areas -->
  <g font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#5a6380" letter-spacing="0.5">
    <text x="180" y="225" text-anchor="middle">Software</text>
    <text x="310" y="225" text-anchor="middle">AI/ML</text>
    <text x="420" y="225" text-anchor="middle">Systems</text>
    <text x="530" y="225" text-anchor="middle">IoT</text>
    <text x="620" y="225" text-anchor="middle">Open Source</text>
    <text x="740" y="225" text-anchor="middle">Hackathons</text>
  </g>

  <!-- Small separator dots between focus areas -->
  <g fill="#00d4ff" opacity="0.3">
    <circle cx="245" cy="222" r="1.5" />
    <circle cx="365" cy="222" r="1.5" />
    <circle cx="475" cy="222" r="1.5" />
    <circle cx="575" cy="222" r="1.5" />
    <circle cx="680" cy="222" r="1.5" />
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="290" width="900" height="2" rx="1" fill="url(#accent-grad)" opacity="0.15" />
</svg>