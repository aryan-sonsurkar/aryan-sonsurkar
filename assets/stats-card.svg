<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" role="img" aria-label="GitHub Stats">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="460" height="200" fill="url(#bg)" rx="8" />
  <text x="24" y="38" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#00d4ff" letter-spacing="1">GitHub Stats</text>
  <line x1="24" y1="50" x2="436" y2="50" stroke="#5a6380" stroke-width="1" opacity="0.5" />
  <text x="24" y="82" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#8892b0">Repositories</text>
  <text x="436" y="82" text-anchor="end" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e0e6ff">34</text>
  <text x="24" y="114" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#8892b0">Stars</text>
  <text x="436" y="114" text-anchor="end" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e0e6ff">9</text>
  <text x="24" y="146" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#8892b0">Followers</text>
  <text x="436" y="146" text-anchor="end" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e0e6ff">6</text>
  <text x="24" y="178" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#8892b0">Following</text>
  <text x="436" y="178" text-anchor="end" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e0e6ff">3</text>
</svg>
