name: Update Profile README

on:
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch full contribution history
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py --user "$GITHUB_USERNAME" --token "$GITHUB_TOKEN" --output data/contributions.json

      - name: Validate contribution data
        run: |
          python -c "
          import json, sys
          with open('data/contributions.json') as f:
              data = json.load(f)
          records = data.get('records', [])
          if not records:
              print('ERROR: No records'); sys.exit(1)
          dates = [r['date'] for r in records]
          if dates != sorted(dates):
              print('ERROR: Dates not sorted'); sys.exit(1)
          if len(dates) != len(set(dates)):
              print('ERROR: Duplicate dates'); sys.exit(1)
          if any(r['contribution_count'] < 0 for r in records):
              print('ERROR: Negative count'); sys.exit(1)
          total = sum(r['contribution_count'] for r in records)
          active = sum(1 for r in records if r['contribution_count'] > 0)
          print(f'OK: {len(records)} days, {active} active, {total} contributions')
          print(f'Range: {dates[0]} to {dates[-1]}')
          "

      - name: Generate flight map SVG
        run: python scripts/generate_flight_map.py --input data/contributions.json --output assets/flight-map.svg

      - name: Validate generated SVG
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          try:
              tree = ET.parse('assets/flight-map.svg')
              root = tree.getroot()
              print(f'OK: Valid SVG, root={root.tag}')
          except ET.ParseError as e:
              print(f'FAIL: {e}'); exit(1)
          "

      - name: Check for changes
        id: changes
        run: |
          git add data/contributions.json assets/flight-map.svg
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected."
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: update flight contribution map [automated]"
          git push
