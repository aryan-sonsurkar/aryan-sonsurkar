name: Update Profile README

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install Pillow imageio numpy

      - name: Fetch full contribution history
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py --user "$GITHUB_USERNAME" --token "$GITHUB_TOKEN" --output data/contributions.json

      - name: Fetch GitHub stats
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py --user "$GITHUB_USERNAME" --token "$GITHUB_TOKEN" --output assets/stats.json

      - name: Generate stats cards
        run: python scripts/generate_stats_cards.py --input assets/stats.json --output-dir assets

      - name: Validate contribution data
        run: |
          python -c "
          import json, sys
          with open('data/contributions.json') as f:
              data = json.load(f)
          records = data.get('records', [])
          if not records:
              print('ERROR: No records'); sys.exit(1)
          dates = [r['date'] for r in records]
          if dates != sorted(dates):
              print('ERROR: Dates not sorted'); sys.exit(1)
          if len(dates) != len(set(dates)):
              print('ERROR: Duplicate dates'); sys.exit(1)
          if any(r['contribution_count'] < 0 for r in records):
              print('ERROR: Negative count'); sys.exit(1)
          total = sum(r['contribution_count'] for r in records)
          active = sum(1 for r in records if r['contribution_count'] > 0)
          print(f'OK: {len(records)} days, {active} active, {total} contributions')
          print(f'Range: {dates[0]} to {dates[-1]}')
          "

      - name: Generate flight animation GIF
        run: python scripts/generate_flight_animation.py --input data/contributions.json --output assets/flight-map.gif

      - name: Generate animated hero
        run: python scripts/generate_hero_animation.py --output assets/hero.gif

      - name: Generate terminal boot intro
        run: python scripts/generate_boot_animation.py --output assets/boot.gif

      - name: Generate project star map
        run: python scripts/generate_project_map_animation.py --output assets/project-map.gif

      - name: Validate generated GIF
        run: |
          python -c "
          from PIL import Image
          import os
          gif = Image.open('assets/flight-map.gif')
          assert gif.format == 'GIF', f'Not GIF: {gif.format}'
          frames = 0
          try:
              while True:
                  frames += 1
                  gif.seek(gif.tell() + 1)
          except EOFError:
              pass
          size_kb = os.path.getsize('assets/flight-map.gif') / 1024
          assert frames > 10, f'Too few frames: {frames}'
          assert size_kb < 8000, f'Too large: {size_kb:.0f} KB'
          print(f'OK: {frames} frames, {size_kb:.0f} KB, {gif.size}')
          "

      - name: Check for changes
        id: changes
        run: |
          git add data/contributions.json assets/flight-map.gif assets/stats-card.svg assets/languages-card.svg assets/hero.gif assets/boot.gif assets/project-map.gif
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected."
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: update flight contribution animation [automated]"
          git push
